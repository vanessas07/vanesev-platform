name: VANESEV Evidencias Verificables por Máquina

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Una sola ejecución a la vez por rama: dos suites en paralelo se pisan en la base de staging.
concurrency:
  # Una sola ejecución a la vez EN TODO EL REPO (todas usan la misma base de staging y la misma
  # vista previa): las demás esperan en cola y no se cancelan.
  group: evidencias-staging-unica
  cancel-in-progress: false

jobs:
  generar-evidencias:
    name: Generar Artefactos de Evidencia CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    # shell: bash explícito = «bash --noprofile --norc -eo pipefail». Sin él, Actions usa «bash -e»
    # y un «node prueba | tee archivo» sale en verde aunque la prueba falle (corregido el 27/10).
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Crear Directorio de Artefactos
        run: mkdir -p evidencias_out

      - name: Obtener IP Pública del Runner
        id: ip
        run: echo "runner_ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Ejecutar Guardias de Integridad (G1-G9, G9 Bloqueante)
        run: |
          node scripts/guardias.cjs | tee evidencias_out/guardias.txt

      - name: Ejecutar Auditoría Multi-Tenant
        run: |
          node scripts/tenant-audit.cjs > evidencias_out/tenant-audit.txt 2>&1 || true
          cat evidencias_out/tenant-audit.txt

      - name: Ejecutar Comprobación Oficial de Contraste WCAG
        run: |
          node scripts/wcag-contrast.cjs > evidencias_out/wcag-contrast.txt 2>&1 || true
          cat evidencias_out/wcag-contrast.txt

      - name: Esperar al despliegue de Vercel de este mismo commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 48); do
            estado=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pendiente"')
            echo "Intento $i: Vercel = $estado"
            if [ "$estado" = "success" ]; then exit 0; fi
            if [ "$estado" = "failure" ] || [ "$estado" = "error" ]; then echo "El despliegue de Vercel ha fallado"; exit 1; fi
            sleep 15
          done
          echo "Vercel no terminó en 12 minutos"; exit 1

      - name: Ejecutar Pruebas Automatizadas de Correcciones de Autenticación (Sección 3)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          RUNNER_IP: ${{ steps.ip.outputs.runner_ip }}
        run: |
          node scripts/test-correcciones.cjs 2>&1 | tee evidencias_out/correcciones-auth.txt

      - name: Ejecutar Suite Automatizada B1-a (Backend de Autenticación)
        # Se ejecuta aunque falle la suite anterior, para ver el cuadro completo; el job sigue en rojo.
        if: ${{ !cancelled() }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUNNER_IP: ${{ steps.ip.outputs.runner_ip }}
        run: |
          node scripts/test-b1a.cjs 2>&1 | tee evidencias_out/b1a-auth.txt

      - name: Subir Artefacto de Evidencias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ github.sha }}
          path: evidencias_out/
          retention-days: 14
