name: VANESEV Cloud CI/CD (7GB RAM VM Verification)

on:
  push:
    branches: [ "staging", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  cloud-verify-and-build:
    name: Typecheck & Production Build (Cloud VM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies in Cloud VM
        run: npm ci --legacy-peer-deps || npm install

      - name: TypeScript Strict Verification (Zero Local CPU)
        run: npx tsc --noEmit

      - name: Vite Production Bundle Verification
        run: npm run build

      - name: Report-Only CI Guards & Tenant Audit (Deuda Técnica)
        run: |
          node scripts/guardias.cjs || true
          node scripts/tenant-audit.cjs || true
